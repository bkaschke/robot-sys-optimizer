[project]
name = "robot-sys-optimizer"
version = "0.0.1"
requires-python = ">=3.11,<3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: full plans, tool optimization, path builds (skipped by test_batches.py --fast)",
    "e2e: headless Edge browser tests (tests/e2e; test_batches.py --e2e)",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]
ignore = ["N802", "N803", "N806", "N815"]  # robotics names like T_flange_mount, L, kg_per_m

[tool.ruff.lint.per-file-ignores]
"scripts/build_guide.py" = ["E501"]  # embedded CSS/JS
