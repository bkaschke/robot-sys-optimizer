# Conda env for robot-sys-optimizer (Miniforge / conda-forge).
#   conda env create -f environment.yml      (first time)
#   conda env update -f environment.yml --prune
name: rso
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pinocchio>=3.4      # FK, Jacobians, RNEA gravity torques
  - coal>=3.0           # collision / distance queries (formerly hpp-fcl)
  - numpy>=1.26
  - libblas=*=*openblas  # MKL build crashes on this Windows box (0xc06d007f on any matmul)
  - scipy>=1.13
  - numba>=0.60          # compiled offset-wrist IK (FANUC CRX, ABB GoFa / PoWa)
  - rtree>=1.3          # trimesh ray casting / nearest-point queries
  - pyyaml
  - pillow             # PNG snapshots in the HTML report
  - lxml               # pycollada (robot .dae meshes); only in the user site before D3
  - pyparsing          # pycollada
  - python-dateutil    # pycollada
  - fonttools          # ezdxf (CadQuery) text/fonts
  - pyinstaller=6.22.3  # scripts/build_exe.py (Windows exe); the version the D0 spike used
  - pyinstaller-hooks-contrib
  - pytest>=8
  - ruff=0.17.3          # pinned (v12 #12): CI lint must match the local one; CI lints on Linux
  - markdown-it-py>=3   # docs/USER_GUIDE.md -> USER_GUIDE.html (scripts/build_guide.py)
  - pip
  - pip:
      - viser>=1.1
      - yourdfpy>=0.0.56
      - pydantic>=2.10
      - trimesh>=4.5
      - xacro>=2.0       # one-time xacro -> URDF conversion (scripts/import_ur_description.py)
      - ortools>=9.10    # station set cover (CP-SAT)
      - cma>=3.3         # CMA-ES refinement
      - shapely>=2.0     # floor footprints, standoff and keep-out zones
      - optuna>=5.0      # v8: Bayesian (TPE) refinement and NSGA-II Pareto fronts (GP is our own, no torch)
      - fast_simplification>=0.1  # 2026-11-11: collision copies of large meshes (core.collision_mesh)
      - manifold3d>=3.0  # v11: the 'wrap' collision shells (core.collision_mesh); was installed but not listed
      - cadquery>=2.8    # v8: STEP export of designed tools (OpenCascade; large, but in the portable zip)
