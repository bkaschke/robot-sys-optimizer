# Conda env for robot-sys-optimizer (Miniforge / conda-forge).
#   conda env create -f environment.yml      (first time)
#   conda env update -f environment.yml --prune
name: rso
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pinocchio>=3.4      # FK, Jacobians, RNEA gravity torques
  - coal>=3.0           # collision / distance queries (formerly hpp-fcl)
  - numpy>=1.26
  - libblas=*=*openblas  # MKL build crashes on this Windows box (0xc06d007f on any matmul)
  - scipy>=1.13
  - rtree>=1.3          # trimesh ray casting / nearest-point queries
  - pyyaml
  - pytest>=8
  - ruff>=0.8
  - pip
  - pip:
      - viser>=1.1
      - yourdfpy>=0.0.56
      - pydantic>=2.10
      - trimesh>=4.5
      - xacro>=2.0       # one-time xacro -> URDF conversion (scripts/import_ur_description.py)
