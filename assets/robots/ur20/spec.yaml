# UR20 registry entry. Values marked with a source are copied, not estimated.
# Missing limits stay null: payload checks refuse to run until they are filled in.
name: ur20
urdf: ur20.urdf                      # generated by scripts/import_ur_description.py
base_link: base_link
flange_link: tool0                   # z out of the flange (ROS-I convention)
ik: ur_analytic
reach_m: 1.75                        # UR20 datasheet
frame_convention: ur                 # userframe export: x y z + rotation vector (UR pose)
home_deg: [0, -90, 0, -90, 0, 0]       # arm pose while the carrier moves between stops (UR home)

# Standard DH parameters (m). Source: ur_description config/ur20/default_kinematics.yaml
# (UR's published DH table for the UR20).
dh:
  frame: base                        # URDF link that coincides with DH frame 0
  d1: 0.2363
  a2: -0.862
  a3: -0.7287
  d4: 0.201
  d5: 0.1593
  d6: 0.1543

payload:
  rated_kg: 20                       # UR20 datasheet
  # Max joint efforts (N·m), shoulder_pan → wrist_3.
  # Source: ur_description config/ur20/joint_limits.yaml (cites UR20 User Manual v5.14).
  joint_torque_Nm: [738.0, 738.0, 433.0, 107.0, 107.0, 107.0]
  # Wrist moments are not published (UR20 datasheet, Dec 2024): the payload curve is used instead.
  wrist_moment_Nm: [null, null, null]
  # Payload curve, "full performance", read off the UR20 datasheet plot (Dec 2024):
  # 20 kg up to 200 mm COG offset, 7 kg at 800 mm (end point confirmed by the user).
  # Beyond 800 mm: linear extrapolation of the last segment (user-approved ESTIMATE),
  # reaching 0 kg at ~1123 mm. The 25 kg "expanded payload" needs manual conditions: not used.
  curve_mm_kg: [[0, 20], [200, 20], [800, 7]]
  curve_extrapolate: linear
  curve_source: "UR20 datasheet Dec 2024 (plot reading); >800 mm extrapolated estimate"
