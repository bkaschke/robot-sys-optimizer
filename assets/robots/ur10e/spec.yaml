# UR10e registry entry (v8 T9). Values marked with a source are copied, not estimated.
name: ur10e
urdf: ur10e.urdf                     # generated by scripts/import_ur_description.py
base_link: base_link
flange_link: tool0                   # z out of the flange (ROS-I convention)
ik: ur_analytic
reach_m: 1.3                         # UR10e datasheet
frame_convention: ur                 # userframe export: x y z + rotation vector (UR pose)
home_deg: [0, -90, 0, -90, 0, 0]       # arm pose while the carrier moves between stops (UR home)

# Standard DH parameters (m). Source: ur_description config/ur10e/default_kinematics.yaml
# (UR's published DH table for the UR10e).
dh:
  frame: base                        # URDF link that coincides with DH frame 0
  d1: 0.1807
  a2: -0.6127
  a3: -0.57155
  d4: 0.17415
  d5: 0.11985
  d6: 0.11655
