# UR30 registry entry (v8 T9). Values marked with a source are copied, not estimated.
name: ur30
urdf: ur30.urdf                      # generated by scripts/import_ur_description.py (base, shoulder
                                     # and wrist meshes are the UR20's: meshes_ur20/)
base_link: base_link
flange_link: tool0                   # z out of the flange (ROS-I convention)
ik: ur_analytic
reach_m: 1.3                         # UR30 datasheet
frame_convention: ur                 # userframe export: x y z + rotation vector (UR pose)
home_deg: [0, -90, 0, -90, 0, 0]       # arm pose while the carrier moves between stops (UR home)

# Standard DH parameters (m). Source: ur_description config/ur30/default_kinematics.yaml
# (UR's published DH table for the UR30).
dh:
  frame: base                        # URDF link that coincides with DH frame 0
  d1: 0.2363
  a2: -0.637
  a3: -0.5037
  d4: 0.201
  d5: 0.1593
  d6: 0.1543
