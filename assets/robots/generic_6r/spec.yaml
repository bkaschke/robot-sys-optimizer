# A MADE-UP example arm (not a real product), generated by scripts/make_generic_robot.py.
# Copy this folder as a template when adding a real industrial arm: replace the URDF and
# meshes, set the OPW parameters from the manufacturer's data (or ROS-Industrial's
# opw_kinematics parameter file), then run scripts/check_robot.py generic_6r.
name: generic_6r
urdf: generic_6r.urdf
base_link: base_link
flange_link: tool0
ik: opw
reach_m: 1.531
frame_convention: matrix
home_deg: [0, -90, 90, 0, 45, 0]

opw:
  a1: 0.15
  a2: -0.12
  b: 0.0
  c1: 0.45
  c2: 0.6
  c3: 0.64
  c4: 0.13
  offsets: [0, -1.57079633, 0, 0, 0, 0]
  sign_corrections: [-1, 1, 1, -1, 1, -1]
